name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # The deployment target is iOS 26, so the runner has to carry the iOS 26 SDK.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      # Printed so a failure caused by an image bump is obvious in the log
      # rather than looking like a code problem.
      - name: Show toolchain
        run: xcodebuild -version

      # Running tests needs a real simulator, so unlike a build-only check it
      # cannot use `generic/platform=iOS Simulator`. Picking whichever iPhone
      # the image happens to ship beats pinning a model that a future image
      # may drop. Signing is off because CI has no certificate.
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 -oE '^ +iPhone [^(]+' | sed 's/^ *//; s/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project ios/MemberApp.xcodeproj \
            -scheme MemberApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      # gradle-wrapper.jar is a binary committed to the repository, and a
      # wrapper jar runs as part of every build. This checks it against the
      # published checksums rather than trusting whatever is in the tree.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # These three are what a reviewer would otherwise run by hand: the logic
      # tests, the lint rules that fail on error, and proof that it assembles.
      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug
